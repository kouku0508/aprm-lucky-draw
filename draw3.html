<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APRM 2026 Lucky Draw</title>
<style>
*{box-sizing:border-box}:root{--bg:#020c13;--radar:#062638;--cyan:#4de7e7;--green:#7df6bf;--gold:#ffd66b;--white:#f4fbff;--muted:#7fa7b7}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 45%,#0a3143 0,#041823 42%,#020a10 100%);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#4de7e708 1px,transparent 1px),linear-gradient(90deg,#4de7e708 1px,transparent 1px);background-size:42px 42px}
.wrap{min-height:100vh;display:flex;flex-direction:column;padding:18px 30px;position:relative}
header{height:122px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #4de7e735}
.logo{height:104px;max-width:310px;object-fit:contain;width:auto;filter:drop-shadow(0 0 8px #4de7e722)}.headtxt{text-align:right}.headtxt b{display:block;letter-spacing:.26em;color:var(--cyan);font-size:13px}.headtxt span{font-size:21px;font-weight:800;letter-spacing:.08em}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.radar{position:absolute;width:min(76vh,760px);height:min(76vh,760px);border:1px solid #4de7e72c;border-radius:50%;background:repeating-radial-gradient(circle,#4de7e716 0 1px,transparent 1px 78px);opacity:.65}
.radar:before,.radar:after{content:"";position:absolute;background:#4de7e725}.radar:before{left:50%;top:0;bottom:0;width:1px}.radar:after{top:50%;left:0;right:0;height:1px}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 320deg,#4de7e71a 345deg,#4de7e766 360deg);animation:scan 5s linear infinite}@keyframes scan{to{transform:rotate(360deg)}}
.content{z-index:2;text-align:center;width:100%}.eyebrow{color:var(--green);letter-spacing:.35em;font-size:14px;font-weight:700;margin-bottom:12px}
.nums{display:flex;justify-content:center;gap:clamp(12px,2.8vw,36px)}.d{width:clamp(145px,19vw,245px);height:clamp(190px,24vw,305px);display:flex;align-items:center;justify-content:center;border:1px solid #4de7e75c;border-radius:10px;background:linear-gradient(180deg,#082b3bcf,#03141dde);font-size:clamp(110px,16vw,205px);font-weight:800;font-family:"Arial Narrow",Arial,sans-serif;color:#eaffff;text-shadow:0 0 18px #4de7e766;box-shadow:inset 0 0 25px #4de7e712,0 0 22px #0009;position:relative}
.d:after{content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;background:#4de7e730}.d.spin{border-color:var(--cyan);box-shadow:0 0 28px #4de7e740,inset 0 0 30px #4de7e718}.d.lock{color:#fff6cf;border-color:var(--gold);text-shadow:0 0 20px #ffd66b88;box-shadow:0 0 30px #ffd66b3b}
.msg{height:50px;margin:18px 0 8px;font-size:clamp(20px,2vw,29px);font-weight:800;letter-spacing:.16em}button{border:1px solid #75f4e2;background:#062d3c;color:#eaffff;padding:14px 30px;border-radius:5px;font-weight:800;font-size:17px;letter-spacing:.12em;cursor:pointer;box-shadow:0 0 16px #4de7e722}button:hover{background:#0a4051}button:disabled{opacity:.35}.meta{margin-top:12px;color:var(--muted);font-size:12px;letter-spacing:.1em}.settings{position:fixed;right:16px;bottom:12px;color:#7395a3;text-decoration:none;font-size:11px;z-index:5}.flash{animation:flash .65s ease 2}@keyframes flash{50%{filter:brightness(1.7);transform:scale(1.012)}}
@media(max-width:700px){.wrap{padding:12px}header{height:88px}.logo{height:76px}.headtxt span{font-size:15px}.d{width:28vw;height:37vw}}
#syncMark{display:none;position:fixed;right:18px;bottom:12px;z-index:20;font:600 11px Arial;letter-spacing:.20em;color:rgba(180,225,232,.42);user-select:none}
#syncWarn{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:20;font:700 11px Arial;letter-spacing:.12em;color:#ffb3a7}
</style></head><body><div id="syncMark">APRM</div><div id="syncWarn">CLOUD SYNC NOT READY</div><div class="wrap"><header><img class="logo" src="aprm-logo.png" alt="42nd IFATCA APRM 2026 Tokyo"><div class="headtxt"><b>ASIA PACIFIC REGIONAL MEETING</b><span>GALA DINNER · LUCKY DRAW</span></div></header>
<div class="stage" id="stage"><div class="radar"><div class="sweep"></div></div><div class="content"><div class="eyebrow">TARGET NUMBER</div><div class="nums"><div class="d" id="d0">—</div><div class="d" id="d1">—</div><div class="d" id="d2">—</div></div><div class="msg" id="msg">STANDBY</div><button id="go">START DRAW</button><div class="meta" id="meta"></div></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,onSnapshot,runTransaction} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={
apiKey:"AIzaSyAAWDyMUHKQXyj9Nkuc-keiAAtySm48Dpo",
  authDomain:"aprm-lucky-draw.firebaseapp.com",
  projectId:"aprm-lucky-draw",
  storageBucket:"aprm-lucky-draw.firebasestorage.app",
  messagingSenderId:"91279305822",
  appId:"1:91279305822:web:a3d77faa3f2c87f077d8cf"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),stateRef=doc(db,"aprm","state");
const ds=[...document.querySelectorAll('.d')],wait=m=>new Promise(r=>setTimeout(r,m));
let state=null,busy=false,serverReady=false,currentVersion=null;
function rnd(m){let a=new Uint32Array(1),L=4294967296-4294967296%m;do{crypto.getRandomValues(a)}while(a[0]>=L);return a[0]%m}
function poolFrom(st){
 const winners=new Set((st?.winners||[]).map(Number));
 return (st?.participants||[]).map(Number).filter(n=>Number.isInteger(n)&&n>0&&n<=999&&!winners.has(n));
}
function updateUI(){
 const p=poolFrom(state),wc=(state?.winners||[]).length;
 go.disabled=busy||!serverReady||!p.length;
 meta.textContent=(serverReady?p.length:0)+' TARGETS ACTIVE  ·  '+wc+' WINNERS';
 syncMark.style.display=serverReady?'block':'none';
 syncWarn.style.display=serverReady?'none':'block';
}
function secureIndex(total){
 let a=new Uint32Array(1),L=4294967296-(4294967296%total);do{crypto.getRandomValues(a)}while(a[0]>=L);return a[0]%total;
}
async function reserveWinner(){
 return await runTransaction(db,async tx=>{
   const snap=await tx.get(stateRef); if(!snap.exists()) throw new Error("NO_CONFIG");
   const st=snap.data(), eligible=poolFrom(st); if(!eligible.length) throw new Error("NO_ELIGIBLE");
   const weighted=new Set((st.weightedNumbers||[]).map(Number));
   const mult=Math.max(1,Number(st.weightMultiplier||1));
   let total=0,weights=eligible.map(n=>{const w=weighted.has(n)?mult:1;total+=w;return w});
   let r=secureIndex(total),winner=eligible[eligible.length-1];
   for(let i=0;i<eligible.length;i++){if(r<weights[i]){winner=eligible[i];break}r-=weights[i]}
   const old=(st.winners||[]).map(Number);
   tx.update(stateRef,{winners:[...old,winner],lastWinner:winner,lastDrawMode:3});
   return winner;
 });
}

async function animateWinner(winner){
 const t=String(winner).padStart(3,'0');
 busy=true;updateUI();msg.textContent='SCANNING…';ds.forEach(x=>x.className='d spin');
 let act=[0,1,2],tm=setInterval(()=>act.forEach(i=>ds[i].textContent=rnd(10)),55);
 await wait(1700);act=act.filter(i=>i!==1);ds[1].textContent=t[1];ds[1].className='d lock';msg.textContent='TENS LOCKED';
 await wait(1800);act=act.filter(i=>i!==0);ds[0].textContent=t[0];ds[0].className='d lock';msg.textContent='HUNDREDS LOCKED';
 await wait(2200);act=[];clearInterval(tm);ds[2].textContent=t[2];ds[2].className='d lock';
 msg.textContent='TARGET ACQUIRED · WINNER '+t;stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),1400);
 busy=false;updateUI();
}

go.onclick=async()=>{
 if(busy||!serverReady)return;
 busy=true;updateUI();
 try{const winner=await reserveWinner();await animateWinner(winner)}
 catch(e){busy=false;updateUI();alert('Cloud draw failed: '+e.message)}
};
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!go.disabled){e.preventDefault();go.click()}if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});
try{
 await signInAnonymously(auth);
 onSnapshot(stateRef,{includeMetadataChanges:true},snap=>{
   if(!snap.exists()||snap.metadata.fromCache||!snap.data().configVersion){serverReady=false;updateUI();return}
   state=snap.data();currentVersion=state.configVersion;serverReady=true;updateUI();
 },e=>{serverReady=false;updateUI();const w=document.getElementById('syncWarn');if(w){w.style.display='block';w.textContent='FIRESTORE ERROR · '+(e.code||'NO_CODE')+' · '+(e.message||String(e));w.style.maxWidth='92vw';w.style.whiteSpace='normal';}console.error(e)});
}catch(e){
 serverReady=false;updateUI();
 const w=document.getElementById('syncWarn');
 if(w){w.style.display='block';w.textContent='CLOUD ERROR · '+(e.code||'NO_CODE')+' · '+(e.message||String(e));w.style.maxWidth='92vw';w.style.whiteSpace='normal';}
 console.error(e);
}
updateUI();
</script></body></html>
